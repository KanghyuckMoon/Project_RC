plugins {
    id 'com.android.application' version '9.0.0'
}

android {
    namespace 'com.moonlab.mooncar'
    compileSdk 36

    defaultConfig {
        applicationId 'com.moonlab.mooncar'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
